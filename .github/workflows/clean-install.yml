name: Clean install

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The agentlane version or npm dist-tag to install
        type: string
        default: next
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.platform }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: web
          - os: macos-26
            platform: ios
          - os: ubuntu-24.04
            platform: web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      VERSION: ${{ inputs.version || 'latest' }}
      BUILD_CACHE: .git/agentlane/build-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Select Xcode and JDK 17
        if: matrix.platform == 'ios'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          echo "AGENTLANE_JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
      - name: Restore the example app's build cache
        id: restore
        if: matrix.platform == 'ios'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILD_CACHE }}
          key: ios-build-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: ios-build-${{ matrix.os }}-
      - name: Count the restored builds as used today
        if: matrix.platform == 'ios' && steps.restore.outputs.cache-matched-key != ''
        run: find "$BUILD_CACHE/.objects" -mindepth 1 -maxdepth 1 -type d -exec touch {} +
      - name: Install agentlane from npm, then up, doctor, screenshot and release
        run: .github/scripts/clean-install.sh "$RUNNER_TEMP/clean-install" "${{ matrix.platform }}" "$VERSION"
      - name: Name the build cache by the builds it holds
        id: builds
        if: always() && matrix.platform == 'ios'
        run: |
          if [ -d "$BUILD_CACHE/.objects" ]; then
            held="$(find "$BUILD_CACHE/.objects" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | shasum | cut -c 1-16)"
            echo "key=ios-build-${{ matrix.os }}-$held" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the build cache when this run stored a new build
        if: always() && matrix.platform == 'ios' && steps.builds.outputs.key != '' && steps.builds.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILD_CACHE }}
          key: ${{ steps.builds.outputs.key }}
      - name: Keep the screenshot and the lane's logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-install-${{ matrix.platform }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/clean-install/
            ~/.local/state/agentlane/lanes/
          if-no-files-found: ignore
