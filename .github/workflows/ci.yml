name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nothing under private/ is tracked
        run: |
          tracked="$(git ls-files private)"
          if [ -n "$tracked" ]; then
            echo "::error::private/ holds the maintainers' notes and stays out of the repository, but these files are tracked:"
            echo "$tracked"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Shellcheck
        run: pnpm run lint:sh
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Smoke test the built CLI
        run: node dist/cli.js --version

  example:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/expo-app
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Web tests
        run: pnpm run test:web
      - name: Keep the traces of failed web tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: examples/expo-app/web/test-results/
          if-no-files-found: ignore

  web-on-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Bring the example app's web half up on its pinned browser, and release it
        run: .github/scripts/web-on-linux.sh "$RUNNER_TEMP/web-on-linux"
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-on-linux
          path: ${{ runner.temp }}/web-on-linux/
          if-no-files-found: ignore
