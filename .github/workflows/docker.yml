name: Docker image

on:
  workflow_call:
    inputs:
      push:
        description: Build linux/amd64 and linux/arm64 and push them to ghcr.io/north-star-hq/agentlane
        type: boolean
        default: false
      version:
        description: The version to tag the pushed image with, which must be package.json's; required when push is true
        type: string
        default: ''

env:
  IMAGE: ghcr.io/north-star-hq/agentlane

jobs:
  smoke:
    name: Build and smoke-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build the image
        run: docker build --build-arg VERSION="$(node -p 'require("./package.json").version')" --tag agentlane:ci .
      - name: Record the image's size
        run: docker image ls agentlane:ci --format 'agentlane:ci (${{ matrix.arch }}) is {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check --version, the user, and the MCP server's tools over docker run -i
        run: .github/scripts/docker-image-check.sh agentlane:ci
      - name: Bring the example app's web half up inside the container, and release it
        run: .github/scripts/docker-web-lane.sh agentlane:ci "$RUNNER_TEMP/docker-web-lane"
      - name: Keep the screenshot and doctor's report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-web-lane-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-web-lane/
          if-no-files-found: ignore

  publish:
    if: inputs.push
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # No permissions key: this job takes packages: write from the calling job, since GitHub refuses a called
    # workflow whose job asks for more than its caller grants, and ci.yml grants contents: read only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the version names package.json's, and pick the tags
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          want="$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$want" ]; then
            echo "::error::The version input is '$VERSION', but package.json's version is $want; call docker.yml with version: $want."
            exit 1
          fi
          tags="$IMAGE:$VERSION"
          case "$VERSION" in
            *-*) echo "$VERSION is a prerelease, so latest stays where it is." ;;
            *) tags="$tags,$IMAGE:latest" ;;
          esac
          {
            echo "tags=$tags"
            echo "description=$(node -p 'require("./package.json").description')"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 and linux/arm64, and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: VERSION=${{ inputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline
          annotations: |
            index:org.opencontainers.image.source=https://github.com/north-star-hq/agentlane
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.version=${{ inputs.version }}
            "index:org.opencontainers.image.description=${{ steps.version.outputs.description }}"
      - name: Check the pushed image answers --version on each platform
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            got="$(docker run --rm --platform "$platform" "$IMAGE:$VERSION" --version)"
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$IMAGE:$VERSION on $platform printed '$got' for --version, not $VERSION."
              exit 1
            fi
            echo "$IMAGE:$VERSION on $platform: $got"
          done
